name: nexustock

services:
  db:
    image: postgres:16-alpine
    container_name: nexustock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexustock}
      POSTGRES_USER: ${POSTGRES_USER:-nexustock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexustock_dev}
      TZ: America/Santiago
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Script con el modelo completo de la BD (solo corre al crear el volumen por primera vez)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: nexustock-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nexustock}
      DB_USER: ${POSTGRES_USER:-nexustock}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexustock_dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-nexustock}:${POSTGRES_PASSWORD:-nexustock_dev}@db:5432/${POSTGRES_DB:-nexustock}
      # Autenticación (ver .env.example). Los valores por defecto son SOLO para desarrollo.
      JWT_SECRET: ${JWT_SECRET:-nexustock-dev-secret-cambiar-en-produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-3001}}
      APP_URL: ${APP_URL:-http://localhost:${FRONTEND_PORT:-3001}}
      TZ_NEGOCIO: ${TZ_NEGOCIO:-America/Santiago}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
    # -L (legacy watch) para detectar cambios desde Windows en el volumen montado
    command: ["npx", "nodemon", "-L", "src/app.js"]
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
