name: nexustock

# Entorno local de NexuStock (ver README.md de esta carpeta).
# Las rutas son relativas a esta carpeta: el código está en «../src Backend», «../src ML» y «../src Frontend».

services:
  db:
    image: postgres:16-alpine
    container_name: nexustock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexustock}
      POSTGRES_USER: ${POSTGRES_USER:-nexustock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexustock_dev}
      TZ: America/Santiago
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Script con el modelo completo de la BD (solo corre al crear el volumen por primera vez)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Contexto = raíz del repositorio, para incluir «src Backend», «src ML» (Python 3.12 + modelo) y los certificados.
      # Qué archivos entran a la imagen: backend/Dockerfile.dockerignore
      context: ..
      dockerfile: Maquinas virtuales/backend/Dockerfile
      target: dev
    container_name: nexustock-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nexustock}
      DB_USER: ${POSTGRES_USER:-nexustock}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexustock_dev}
      # Base del backend: PostgreSQL local por defecto. Para usar Supabase, define BACKEND_DATABASE_URL y DB_SSL en .env
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://${POSTGRES_USER:-nexustock}:${POSTGRES_PASSWORD:-nexustock_dev}@db:5432/${POSTGRES_DB:-nexustock}}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_CA: ${DB_SSL_CA:-}
      # Autenticación (ver .env.example). Los valores por defecto son SOLO para desarrollo.
      JWT_SECRET: ${JWT_SECRET:-nexustock-dev-secret-cambiar-en-produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      APP_URL: ${APP_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      TZ_NEGOCIO: ${TZ_NEGOCIO:-America/Santiago}
      # Tras crear la primera cuenta (administrador) el registro público queda cerrado; el resto del equipo se crea en Configuración.
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      # Límite de intentos por cliente real (ver src Backend/src/lib/ipCliente.js); vacío = IP visible por la API
      PROXY_SECRET: ${PROXY_SECRET:-}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      # Parámetros del negocio (nombre, alertas) y motor predictivo (Python 3.12 incluido en la imagen)
      DATA_DIR: /app/data
      ML_ENGINE_DIR: /ml-engine
      PYTHON_BIN: ${PYTHON_BIN:-python3}
      EVALUACION_CADA_MIN: ${EVALUACION_CADA_MIN:-60}
      # Datos históricos: «hoy» del sistema (ver .env.example). Vacío = fecha del reloj.
      FECHA_REFERENCIA: ${FECHA_REFERENCIA:-}
    # -L (legacy watch) para detectar cambios desde Windows en el volumen montado
    command: ["npx", "nodemon", "-L", "src/app.js"]
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - type: bind
        source: ../src Backend
        target: /app
      - /app/node_modules
      # Parámetros del negocio: sobreviven a reconstruir el contenedor
      - appdata:/app/data
      # Motor predictivo (solo lectura): predict.py y models/
      - type: bind
        source: ../src ML
        target: /ml-engine
        read_only: true
      # Certificado público de la CA de Supabase (DB_SSL=verificado, DB_SSL_CA=/certs/prod-ca-2021.crt)
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy

  # Carga de los datos históricos reales (src ML/cargar_bd.py) sin instalar Python en el equipo.
  # No se levanta con «docker compose up»: se ejecuta a pedido, por ejemplo
  #   docker compose --profile carga run --rm carga --hasta 2024-09-22
  carga:
    profiles: ["carga"]
    image: python:3.12-slim-bookworm
    working_dir: /ml
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexustock}:${POSTGRES_PASSWORD:-nexustock_dev}@db:5432/${POSTGRES_DB:-nexustock}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    entrypoint: ["sh", "-c", "pip install -q -r requirements.txt 'psycopg[binary]' && python cargar_bd.py \"$$@\"", "cargar_bd"]
    volumes:
      - type: bind
        source: ../src ML
        target: /ml
        read_only: true
      # Caché de pip: la segunda ejecución no vuelve a descargar pandas ni scikit-learn
      - pipcache:/root/.cache/pip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
  pipcache:
