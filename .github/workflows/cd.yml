# Despliegue continuo de NexuStock (tarea 19): entorno demo de la defensa.
#
#   demo · entorno gratuito (escenario A de la TCO #8): Vercel (frontend) + Render Free (backend = API + motor ML) +
#          Supabase Free (PostgreSQL). Corre solo cuando CI termina en verde sobre main, o a mano
#          (Actions → CD → Run workflow) para redesplegar el último commit de main. Llama al deploy hook de Render
#          (secreto RENDER_DEPLOY_HOOK), despliega el frontend con la CLI de Vercel (secretos VERCEL_TOKEN,
#          VERCEL_ORG_ID, VERCEL_PROJECT_ID) y prueba /api/health en la URL pública (variable URL_DEMO).
#          Sin esos secretos, cada paso se omite con un aviso.
#
# Alcance (acta del 16-11-2026): el proyecto llega hasta la etapa demo. La implementación con un proveedor cloud
# (Azure Container Apps, publicación de imágenes en GHCR y promoción a producción con aprobación) requiere inversión y
# es una fase futura; esa versión del workflow queda en el historial (commit 48b15f6) para retomarla.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-demo
  cancel-in-progress: false

jobs:
  demo:
    name: Redesplegar la demo (Render + Vercel)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy hook de Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::Sin RENDER_DEPLOY_HOOK: la demo no se redespliega."; exit 0; fi
          curl -fsS -X POST "$HOOK&ref=$SHA" > /dev/null && echo "Despliegue de $SHA solicitado a Render."
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Frontend en Vercel (producción)
        working-directory: src Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Sin secretos de Vercel: el frontend de la demo no se redespliega."; exit 0
          fi
          # La compilación ocurre en Vercel con sus variables de producción (API_URL)
          npx --yes vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Prueba de humo (/api/health a través de Vercel)
        if: vars.URL_DEMO != ''
        run: |
          # Render Free tarda en arrancar y en construir la imagen: hasta 15 minutos
          sleep 120
          for i in $(seq 1 26); do
            if curl -fsS --max-time 60 "${{ vars.URL_DEMO }}/api/health"; then exit 0; fi
            sleep 30
          done
          echo "::error::La demo no respondió en ${{ vars.URL_DEMO }}/api/health"; exit 1
